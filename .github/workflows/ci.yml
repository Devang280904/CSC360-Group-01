name: Java checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.java == '25' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and run regression tests
        run: bash scripts/test.sh
      - name: Validate and generate Javadoc
        run: bash scripts/javadoc.sh
